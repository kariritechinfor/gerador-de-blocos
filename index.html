<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Profissional de Impressos - KaririTech</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            transition: background 0.3s ease;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Otimizações específicas para a folha A4 no preview */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 12mm;
            background: white;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            color: black;
        }
        
        /* Forçar quebras de página corretas no PDF */
        .page-break {
            page-break-after: always;
        }

        /* Classes de Papel de Parede / Fundo para o Sistema */
        .bg-padrao { background-color: #f1f5f9; }
        .bg-escuro { background-color: #0f172a; }
        .bg-azul { background-color: #1e3a8a; }
        .bg-tecnologico { background-image: linear-gradient(135deg, #0f172a 25%, #1e1b4b 100%); }
    </style>
</head>
<body id="corpo-sistema" class="bg-padrao font-sans antialiased min-h-screen">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎟️</span>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-white">KaririTech <span class="text-red-500">ImpressosPro</span></h1>
                    <p class="text-xs text-slate-400">Gerador Automatizado de Rifas, Bingos, Recibos e Calendários A4</p>
                </div>
            </div>
            
            <div class="bg-slate-800 p-2 rounded-lg border border-slate-700 flex items-center gap-2">
                <label class="text-xs font-bold uppercase text-slate-400 px-1">Fundo:</label>
                <select id="seletor-fundo" onchange="mudarFundoSistema()" class="bg-slate-900 text-white text-xs rounded border border-slate-600 p-1 focus:outline-none cursor-pointer">
                    <option value="bg-padrao">Cinza Claro (Padrão)</option>
                    <option value="bg-escuro">Modo Escuro</option>
                    <option value="bg-azul">Azul Corporativo</option>
                    <option value="bg-tecnologico">Degradê Tech</option>
                </select>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto whitespace-nowrap py-2">
            <button onclick="switchTab('rifas')" id="btn-rifas" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-red-600 text-white shadow-sm">
                🎟️ Rifas e Bilhetes
            </button>
            <button onclick="switchTab('bingo')" id="btn-bingo" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:bg-slate-100">
                🎰 Cartelas de Bingo
            </button>
            <button onclick="switchTab('recibos')" id="btn-recibos" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:bg-slate-100">
                📄 Blocos de Recibo
            </button>
            <button onclick="switchTab('calendarios')" id="btn-calendarios" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-600 hover:bg-slate-100">
                📅 Calendários A4 / Mini
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <section id="rifas" class="tab-content active">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div class="lg:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <span class="text-red-600">■</span> Parâmetros da Rifa (Tamanho Ampliado)
                    </h3>
                    
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Título Principal</label>
                        <input type="text" id="rifa-titulo" value="AÇÃO ENTRE AMIGOS" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Descrição dos Prémios</label>
                        <textarea id="rifa-desc" rows="3" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">1º Prémio: Computador Completo Intel Core i5\n2º Prémio: Kit Teclado e Rato Sem Fios</textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Valor (R$)</label>
                            <input type="text" id="rifa-valor" value="10,00" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Data do Sorteio</label>
                            <input type="date" id="rifa-data" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nº Inicial</label>
                            <input type="number" id="rifa-inicio" value="1" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Qtd Total Bilhetes</label>
                            <input type="number" id="rifa-qtd" value="6" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Logomarca (Compartilhada com Calendário)</label>
                        <input type="file" id="rifa-logo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                    </div>

                    <div class="pt-4 space-y-2">
                        <button onclick="gerarRifas()" class="w-full bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-slate-900 transition shadow-sm cursor-pointer">
                            🔄 Atualizar Preview
                        </button>
                        <button onclick="exportarPDF('print-area-rifas', 'rifas_sequenciais')" class="w-full bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-emerald-700 transition shadow-sm cursor-pointer flex items-center justify-center gap-2">
                            💾 Descarregar PDF (A4)
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-8 bg-slate-400 p-4 rounded-xl overflow-x-auto border border-slate-500">
                    <div id="print-area-rifas" class="a4-page">
                        <p class="text-slate-400 text-center py-20 font-medium">Configure os campos e clique em "Atualizar Preview".</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="bingo" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div class="lg:col-span-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-2">
                        <span class="text-blue-600">■</span> Configuração do Bingo
                    </h3>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Título do Evento</label>
                        <input type="text" id="bingo-titulo" value="GRANDE BINGO BENEFICENTE" class="w-full rounded
